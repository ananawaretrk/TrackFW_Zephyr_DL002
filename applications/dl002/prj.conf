# ---------------------------------------------------------------------------
# Console and logging: over RTT (J-Link), no UART
# ---------------------------------------------------------------------------
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
# 1 KB for text waiting for the J-Link: keeps all boot lines even if the RTT viewer attaches late
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=1024
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=1

# Logging: LOG_ERR / LOG_WRN / LOG_INF with time and module name, printed at once (no log thread)
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# No float printing (%f): saves ~4.9 KB flash. Logs print values as whole numbers instead
CONFIG_CBPRINTF_FP_SUPPORT=n

# ---------------------------------------------------------------------------
# Hardware and power
# ---------------------------------------------------------------------------
# SPI to the HCT6911 temperature ADC
CONFIG_SPI=y

# Sleep (EM2) whenever all threads are idle
CONFIG_PM=y

# ---------------------------------------------------------------------------
# Bluetooth: temperature advertising, and connectable for the first 15 s after power-on
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="DL002"

# Connectable: a phone can connect (needed for DFU, also brings in GATT)
CONFIG_BT_PERIPHERAL=y
# One phone at a time
CONFIG_BT_MAX_CONN=1

# Scan: listen for other devices' advertisements (tested, not needed now)
#CONFIG_BT_OBSERVER=y

# RAM savings: features we don't use (we don't scan or pair). The Silabs controller takes its
# 6 KB buffer from the RAM left over at start-up, so every byte saved here counts
# 4 buffers for controller -> host events instead of 10. Saves ~700 B RAM
CONFIG_BT_BUF_EVT_RX_COUNT=4
# 1 buffer for scan reports instead of 3. Saves 140 B RAM
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
# No GATT caching: the phone re-reads our service list on each connect.
# Saves ~1.5 KB RAM (no extra Bluetooth thread) and ~5 KB flash
CONFIG_BT_GATT_CACHING=n
# No "services changed" notice: our services never change. Saves ~940 B flash
CONFIG_BT_GATT_SERVICE_CHANGED=n
# Phone reading several values in one request: not needed for our 3 services
CONFIG_BT_GATT_READ_MULTIPLE=n
# Room for 4 crypto keys at once instead of 16. Saves 816 B RAM
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=4
# Bluetooth asserts still report, just without file/line text
CONFIG_BT_ASSERT_VERBOSE=n

# ---------------------------------------------------------------------------
# DFU: firmware update over BLE (MCUmgr SMP service, e.g. nRF Connect Device Manager).
# The new image goes into slot 1, MCUboot swaps it in on the next reset.
# CONFIG_FLASH is already in dl002_defconfig
# ---------------------------------------------------------------------------
CONFIG_MCUMGR=y
# MCUmgr messages are CBOR-encoded
CONFIG_ZCBOR=y
# Over BLE; long messages arrive in pieces and are put back together
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
# 2 message buffers instead of 4: one for the incoming piece, one for the reply. Saves 768 B RAM.
# The phone must send one piece at a time (Device Manager: "Number of mcumgr buffers" = 1)
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=2
# OS commands (reset after an update). "echo" is not needed
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=n
# Tell the phone our buffer count/size so it never sends more than fits
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
# Image commands: upload, list, test, confirm
CONFIG_MCUMGR_GRP_IMG=y
# Write the received image into the slot 1 flash partition
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y
# Erase each flash sector just before writing it, instead of the whole slot at the start
CONFIG_IMG_ERASE_PROGRESSIVELY=y
