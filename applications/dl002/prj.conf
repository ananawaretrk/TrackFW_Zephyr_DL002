CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=2048
CONFIG_SEGGER_RTT_MAX_NUM_UP_BUFFERS=1

# SPI to the HCT6911 temperature ADC
CONFIG_SPI=y

# Bluetooth: advertise only (no connections yet)
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="DL002"

# Sleep (EM2) whenever all threads are idle
CONFIG_PM=y

# Logging: LOG_ERR / LOG_WRN / LOG_INF, shown over RTT with time and module name
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# No float printing (%f): saves ~4.9 KB flash. Logs print values as whole numbers instead
CONFIG_CBPRINTF_FP_SUPPORT=n

# ---------------------------------------------------------------------------
# Step 1 memory test: uncomment one feature block at a time, build, note FLASH / RAM
# ---------------------------------------------------------------------------

# Scan: listen for other devices' advertisements
#CONFIG_BT_OBSERVER=y

# Connectable: a phone can connect (also brings in GATT)
CONFIG_BT_PERIPHERAL=y

# DFU over BLE: MCUmgr receives the new image into slot 1 (needs PERIPHERAL).
# CONFIG_FLASH is already in dl002_defconfig
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
